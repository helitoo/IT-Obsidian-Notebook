name: Sync Content to Iton Repo

on:
  push:
    branches:
      - main # Thay đổi thành 'master' nếu branch mặc định của bạn là master

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository IT-Obsidian-Notebook
      - name: Checkout IT-Obsidian-Notebook
        uses: actions/checkout@v4
        with:
          path: source-repo

      # Step 2: Checkout repository iton với Token đã tạo
      - name: Checkout iton
        uses: actions/checkout@v4
        with:
          repository: helitoo/iton
          token: ${{ secrets.PAT_TOKEN }}
          path: target-repo

      # Step 3: Copy toàn bộ nội dung sang thư mục public/content của iton
      - name: Copy files to public/content
        run: |
          # Tạo thư mục public/content trong target-repo nếu chưa tồn tại
          mkdir -p target-repo/public/content

          # Xóa sạch nội dung cũ trong public/content (tránh lưu file đã bị xóa từ source)
          rm -rf target-repo/public/content/*

          # Copy tất cả các file/folder từ source-repo (loại trừ .git, .github, .obsidian, ct2mnf.js, content2manifest.js)
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.obsidian' \
            --exclude='ct2mnf.js' \
            --exclude='content2manifest.js' \
            source-repo/ target-repo/public/content/

      # Step 4: Commit và Push thay đổi sang repository iton
      - name: Commit and Push changes
        run: |
          cd target-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add public/content
          
          # Kiểm tra nếu có sự thay đổi mới tiến hành commit
          if git status --porcelain | grep -q .; then
            git commit -m "chore: sync content from IT-Obsidian-Notebook [skip ci]"
            git push origin main # Thay đổi 'main' nếu branch của iton dùng tên khác
          else
            echo "No changes detected. Skipping commit."
          fi